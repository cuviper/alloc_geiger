[package]
name = "alloc_geiger"
version = "0.4.2"
edition = "2024"
license = "MIT/Apache-2.0"
repository = "https://github.com/cuviper/alloc_geiger"
keywords = ["allocator"]
categories = ["memory-management"]
readme = "README.md"
description = """
A Rust allocator which makes sound when active, like a Geiger counter.
"""
rust-version = "1.87"

[dependencies.rodio]
version = "0.22"
default-features = false
features = ["playback"]

[dev-dependencies]
jemallocator = "0.5"
